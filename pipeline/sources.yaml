# 수집 소스 목록.
#
# 원칙
#  - 매체가 직접 제공하는 RSS 만 쓴다. 뉴스 애그리게이터(구글뉴스 등)는 쓰지 않는다.
#    애그리게이터 링크는 원문 URL 이 아니라 리다이렉트 주소이고, 발행일도
#    원문과 다르게 찍히는 경우가 있어 오래된 기사가 신규로 잡힌다.
#  - RSS 가 주는 제목·링크·발행일만 받는다. 기사 본문은 저장하지 않는다.
#  - 종합 매체는 전체 기사 피드만 제공하므로 keywords 로 걸러 쓴다.
#    keywords 가 없는 소스는 전량 통과시킨다(도메인 전문 매체).

defaults:
  max_items_per_source: 30
  lookback_days: 10

# 종합 매체에 적용할 기본 키워드. 제목과 발췌에서 찾는다.
keywords_ko:
  - 수소
  - 암모니아
  - 수전해
  - 연료전지
  - CCUS
  - CCS
  - 탄소포집
  - 이산화탄소 포집
  - 액화탄산
  - 청정수소
  - 그린수소
  - 블루수소

# 기사가 아닌 항목. 제목에 이 문구가 있으면 버린다.
exclude_patterns:
  - "바로잡습니다"
  - "[부고]"
  - "[인사]"
  - "[알림]"
  - "[포토]"
  - "[사고]"
  - "입찰정보"
  - "동정"

keywords_en:
  - hydrogen
  - ammonia
  - electrolyser
  - electrolyzer
  - carbon capture
  - CCUS
  - CCS
  - CO2 storage
  - e-SAF
  - e-methanol
  - e-fuel

sources:
  # ── 국내: 수소·가스 전문지 (전량 수집) ────────────────
  - name: "수소신문"
    url: "https://www.h2news.kr/rss/allArticle.xml"
    region_hint: "국내"

  - name: "가스신문"
    url: "https://www.gasnews.com/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  # ── 국내: 에너지 종합지 (키워드 필터) ──────────────────
  - name: "에너지신문"
    url: "https://www.energy-news.co.kr/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  - name: "투데이에너지"
    url: "https://www.todayenergy.kr/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  - name: "전기신문"
    url: "https://www.electimes.com/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  - name: "에너지데일리"
    url: "https://www.energydaily.co.kr/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  - name: "이투뉴스"
    url: "http://www.e2news.com/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  - name: "인더스트리뉴스"
    url: "https://www.industrynews.co.kr/rss/allArticle.xml"
    region_hint: "국내"
    keywords: ko

  # ── 해외: 수소·탄소 전문 매체 ─────────────────────────
  - name: "FuelCellsWorks"
    url: "https://fuelcellsworks.com/feed"
    region_hint: "해외"

  - name: "Hydrogen Central"
    url: "https://hydrogen-central.com/feed/"
    region_hint: "해외"

  - name: "Hydrogen Fuel News"
    url: "https://www.hydrogenfuelnews.com/feed/"
    region_hint: "해외"

  - name: "Carbon Herald"
    url: "https://carbonherald.com/feed/"
    region_hint: "해외"

  - name: "Carbon Credits"
    url: "https://carboncredits.com/feed/"
    region_hint: "해외"
    keywords: en

  - name: "Global CCS Institute"
    url: "https://www.globalccsinstitute.com/feed/"
